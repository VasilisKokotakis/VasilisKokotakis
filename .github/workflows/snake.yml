name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#4363ff&color_dots=#eaeef2,#b9f4fa,#5fd8ec,#3b8cf7,#3b3fd6
            dist/snake-dark.svg?palette=github-dark&color_snake=#28e6f4&color_dots=#161b22,#0e4a5c,#1590b0,#28e6f4,#9ff8ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
